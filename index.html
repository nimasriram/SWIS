<!DOCTYPE html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMER Dispatch Console · UT Dallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("umer-theme")||"dark"}catch(e){}</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#e87500"/><path d="M20 33s-9-9.2-9-15.5a9 9 0 0 1 18 0C29 23.8 20 33 20 33z" fill="#fff"/><circle cx="20" cy="17.5" r="3.6" fill="#e87500"/></svg>
    <div><b>UMER</b><small>Dispatch Console · UT Dallas</small></div>
  </div>
  <span class="simchip">Prototype · simulated data</span>
  <div class="sp"></div>
  <span class="clock" id="clock"></span>
  <button class="hbtn" id="snd" type="button" aria-pressed="true">Sound on</button>
  <button class="hbtn" id="thm" type="button" aria-label="Switch between light and dark mode">
    <svg class="i-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span id="thmLbl">Light</span>
  </button>
  <button class="hbtn" id="rst" type="button">Reset demo</button>
  <button class="hbtn pri" id="sim" type="button">＋ Simulate SOS</button>
</header>

<main>
  <aside>
    <section class="panel" id="pFeed">
      <div class="ph"><h2>Live campus events</h2><span class="live"><i></i>LIVE</span></div>
      <div id="feed" class="scroll"></div>
    </section>

    <section class="panel" id="pAct">
      <button class="ph acc" id="accBtn" type="button" aria-expanded="true" aria-controls="cards">
        <h2>Active emergencies</h2><span class="count" id="nA2">0</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="cards" class="scroll"></div>
    </section>
  </aside>

  <div id="mapw">
    <div id="map"></div>
    <div class="dim" id="dim"></div>
    <div id="mapnote"></div>
    <div id="alert" role="alertdialog" aria-live="assertive" aria-label="New SOS alert"></div>
    <div id="drawer" aria-label="Ticket details"></div>
    <div id="toast" role="status"></div>
  </div>
</main>

<footer>
  <div class="fstat act"><b id="nA">0</b><span>Active<br>emergencies</span></div>
  <div class="fstat res"><b id="nR">0</b><span>Resolved<br>emergencies</span></div>
  <div class="sp"></div>
  <div class="legend" id="legend"></div>
</footer>

<div id="fx" aria-hidden="true"></div>

<script src="js/config.js"></script>
<script src="js/campus-data.js"></script>
<script src="js/floor-logic.js"></script>
<script src="js/state.js"></script>
<script src="js/map.js"></script>
<script src="js/render.js"></script>
<script src="js/detail.js"></script>
<script src="js/alerts.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body></html>
